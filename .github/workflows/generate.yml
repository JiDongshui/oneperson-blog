# ===== 定时内容生成：DeepSeek 生成文章 → 提交 =====
# 触发：schedule（定时）/ workflow_dispatch（手动）
# 凭证（GitHub repo Settings → Secrets）：DEEPSEEK_API_KEY
name: generate-content

on:
  schedule:
    # 每天 UTC 03:17（北京 11:17）生成一篇；按需改 cron
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 要生成的主题（留空用默认）
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 生成文章
        run: node scripts/generate.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOPIC: ${{ inputs.topic }}
      - name: 提交生成的 Markdown
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'content: auto-generate post by DeepSeek'
          commit_user_name: 'op-ai-employee'
          commit_user_email: 'op@local'
          skip_dirty_check: false
      # GITHUB_TOKEN 提交不会触发其他 workflow（GitHub 安全机制），
      # 必须主动触发 deploy 才能把新文章发布到 DEV.to / 构建博客站。
      # 触发需要具有 Actions 写权限的 token：配置 secret ACTIONS_PAT（未配置时仅警告，文章仍已提交成功）
      - name: 主动触发分发构建（构建站点 + 发布 DEV.to）
        run: |
          if [ -n "${ACTIONS_PAT}" ]; then
            gh workflow run deploy-and-distribute
            echo "已触发 deploy-and-distribute"
          else
            echo "::warning::未配置 ACTIONS_PAT secret，无法自动触发 deploy。文章已提交，请手动 Run workflow 或 push 触发。"
          fi
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}
