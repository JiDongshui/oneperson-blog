# ===== 定时内容生成：DeepSeek 生成文章 → 提交 =====
# 触发：schedule（定时）/ workflow_dispatch（手动）
# 凭证（GitHub repo Settings → Secrets）：DEEPSEEK_API_KEY
name: generate-content

on:
  schedule:
    # 每天 UTC 03:17（北京 11:17）生成一篇；按需改 cron
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 要生成的主题（留空用默认）
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 生成文章
        run: node scripts/generate.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOPIC: ${{ inputs.topic }}
      - name: 提交生成的 Markdown
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'content: auto-generate post by DeepSeek'
          commit_user_name: 'op-ai-employee'
          commit_user_email: 'op@local'
          skip_dirty_check: false
